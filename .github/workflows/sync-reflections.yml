name: Sync ProfEx portfolio from Google Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-reflections.yml"
      - "portfolio-v2.css"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Confirm Google is configured
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Google credentials are missing; cannot synchronise."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API and media dependencies
        run: pip install "google-auth>=2,<3" "requests>=2.31,<3" "Pillow>=10,<12"

      - name: Sync Docs Sheets Slides and Drive files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_workspace.py

      - name: Commit updated website files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync ProfEx portfolio from Google Drive"
            if ! git push; then
              echo "The repository changed during synchronisation; rebuilding on the latest revision."
              git fetch origin main
              git reset --hard origin/main
              python scripts/sync_workspace.py
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "Sync ProfEx portfolio from Google Drive"
                git push
              fi
            fi
          else
            echo "No changes to source files."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy current website
        id: deployment
        uses: actions/deploy-pages@v4
