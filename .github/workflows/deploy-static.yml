name: Deploy portfolio website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "portfolio-v2.css"
      - "assets/**"
      - ".github/workflows/deploy-static.yml"
      - ".github/actions/publish-portfolio/**"
      - "scripts/deploy_pages.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          ref: main
      # Share successful-publication state with the hourly Drive sync.
      - name: Publish website changes
        id: deployment
        uses: ./.github/actions/publish-portfolio
